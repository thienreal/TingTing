# ============================================================
# docker-compose.yml — TingTing Project
# ============================================================
# Mục đích: Khởi động môi trường phát triển (dev) cục bộ bao gồm:
#   - PostgreSQL   : Cơ sở dữ liệu chính của hệ thống
#   - pgAdmin      : Giao diện web để quản lý và xem dữ liệu PostgreSQL
#
# Cách dùng:
#   - Khởi động  : docker-compose up -d
#   - Dừng lại   : docker-compose down
#   - Xem log    : docker-compose logs -f
#   - Xóa sạch   : docker-compose down -v  (XÓA LUÔN DỮ LIỆU)
#
# Sau khi chạy:
#   - PostgreSQL chạy tại    : localhost:5432
#   - pgAdmin chạy tại       : http://localhost:5050
# ============================================================

version: '3.8'

services:

  # ----------------------------------------------------------
  # POSTGRESQL - Cơ sở dữ liệu chính
  # ----------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tingting_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      # HOST_PORT:CONTAINER_PORT
      # Truy cập từ máy host qua cổng 5432
      - "5432:5432"
    volumes:
      # Lưu dữ liệu PostgreSQL vào volume để không bị mất khi restart container
      - postgres_data:/var/lib/postgresql/data
      # Chạy script khởi tạo khi lần đầu tạo container
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tingting_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # PGADMIN - Giao diện web quản lý PostgreSQL
  # Truy cập: http://localhost:5050
  # Đăng nhập: admin@tingting.dev / admin123
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tingting_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tingting.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - tingting_network
    depends_on:
      postgres:
        condition: service_healthy

# ----------------------------------------------------------
# VOLUMES - Lưu trữ dữ liệu bền vững
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ----------------------------------------------------------
# NETWORKS - Mạng nội bộ giữa các container
# ----------------------------------------------------------
networks:
  tingting_network:
    driver: bridge
